<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sem Conexão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', sans-serif;
        }
        .offline-card {
            background: white;
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .offline-icon { font-size: 4rem; color: #4361ee; margin-bottom: 20px; }
        .offline-card h2 { font-weight: 700; color: #2d3436; margin-bottom: 10px; }
        .offline-card p { color: #636e72; margin-bottom: 25px; }
        .btn-retry {
            background: linear-gradient(135deg, #4361ee, #4895ef);
            color: white; border: none; border-radius: 12px;
            padding: 12px 30px; font-weight: 600;
        }
        .btn-retry:hover { transform: translateY(-2px); color: white; }
    </style>
</head>
<body>
    <div class="offline-card">
        <i class="bi bi-wifi-off offline-icon"></i>
        <h2>Você está offline</h2>
        <p>Verifique sua conexão e tente novamente.</p>
        <button class="btn btn-retry" onclick="window.location.reload()">
            <i class="bi bi-arrow-clockwise me-2"></i>Tentar novamente
        </button>
    </div>
</body>
</html>
