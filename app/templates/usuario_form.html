{% extends "base.html" %}
{% block title %}Editar Usuário{% endblock %}
{% block page_title %}Editar Usuário{% endblock %}

{% block content %}
<div class="card-modern p-4" style="max-width:600px;">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" name="nome" class="form-control-modern" value="{{ usuario.nome }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" name="email" class="form-control-modern" value="{{ usuario.email }}" required>
        </div>
        <div class="mb-3 form-check">
            <input class="form-check-input" type="checkbox" name="is_admin" id="is_admin" {% if usuario.is_admin %}checked{% endif %}>
            <label class="form-check-label" for="is_admin">Administrador</label>
        </div>
        <div class="mb-3 form-check">
            <input class="form-check-input" type="checkbox" name="ativo" id="ativo" {% if usuario.ativo %}checked{% endif %}>
            <label class="form-check-label" for="ativo">Ativo</label>
        </div>
        <button type="submit" class="btn btn-primary-modern"><i class="bi bi-check-lg me-1"></i>Salvar</button>
        <a href="{{ url_for('admin.usuarios') }}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
